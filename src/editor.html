<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor | TSM Interior Decor</title>
<meta name="description" content="Interactive canvas image editor by TSM Interior Decor. Upload a photo, adjust brightness, contrast, filters, rotate, crop and download.">
<meta name="theme-color" content="#0d0f12">
<style>
:root{
  --orange:#ff5b12;--gold:#f4b331;--dark:#0d0f12;--panel:#15181d;--panel2:#1b1f26;
  --line:#2a2f38;--light:#f7f5f1;--muted:#8b919b;--text:#e9ecf1;--radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--dark);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;background:rgba(13,15,18,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.brand small{display:block;color:var(--orange);font-size:11px;font-weight:700;letter-spacing:2px}
.topbar .back{font-size:13px;color:var(--muted)}
.topbar .back:hover{color:var(--gold)}

/* app shell */
.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100dvh - 65px)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px;overflow-y:auto;max-height:calc(100dvh - 65px)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:26px;background:
    linear-gradient(45deg,#101216 25%,transparent 25%),
    linear-gradient(-45deg,#101216 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#101216 75%),
    linear-gradient(-45deg,transparent 75%,#101216 75%);
  background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0;background-color:#0b0c0f}

/* sidebar groups */
.group{margin-bottom:22px}
.group h3{margin:0 0 12px;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.group h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--orange)}

.control{margin-bottom:14px}
.control .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.control .row span:last-child{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:999px;
  background:linear-gradient(90deg,var(--orange) var(--fill,50%),#333a44 var(--fill,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:3px solid var(--orange);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--orange);cursor:pointer}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;transition:.15s;width:100%}
.btn:hover{border-color:var(--orange);color:#fff}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-grid.tri{grid-template-columns:1fr 1fr 1fr}

/* presets */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{padding:9px 8px;font-size:12px;font-weight:700;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--muted);transition:.15s}
.preset:hover{color:#fff;border-color:var(--gold)}
.preset.active{border-color:var(--orange);color:#fff;background:rgba(255,91,18,.14)}

/* stage / canvas */
#canvas{max-width:100%;max-height:calc(100dvh - 165px);border-radius:8px;box-shadow:0 22px 60px rgba(0,0,0,.55);display:none}
.dropzone{width:min(560px,90%);border:2px dashed var(--line);border-radius:20px;padding:54px 30px;text-align:center;
  background:rgba(255,255,255,.02);transition:.2s}
.dropzone.drag{border-color:var(--orange);background:rgba(255,91,18,.08)}
.dropzone .ic{font-size:46px}
.dropzone h2{margin:14px 0 6px;font-size:22px}
.dropzone p{color:var(--muted);margin:0 0 22px;font-size:14px}
.dropzone .pick{display:inline-flex;background:var(--orange);color:#fff;padding:12px 22px;border-radius:10px;font-weight:800}

/* stage footer toolbar */
.stagebar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  background:rgba(21,24,29,.92);border:1px solid var(--line);padding:8px;border-radius:14px;backdrop-filter:blur(6px)}
.stagebar button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--text);font-size:16px;display:grid;place-items:center}
.stagebar button:hover{border-color:var(--orange);color:#fff}
.hint{position:absolute;top:14px;left:14px;font-size:12px;color:var(--muted);background:rgba(21,24,29,.8);
  padding:6px 12px;border-radius:8px;border:1px solid var(--line)}

.meta{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:4px;line-height:1.7}
.meta b{color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{order:2;border-right:none;border-top:1px solid var(--line);max-height:none}
  .stage{order:1;min-height:56dvh}
  #canvas{max-height:48dvh}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">
    <img class="logo" src="logo.jpeg" alt="TSM Interior Decor logo">
    <span>Photo Editor<small>TSM INTERIOR DECOR</small></span>
  </a>
  <a class="back" href="index.html">← Back to site</a>
</header>

<div class="app">
  <!-- CONTROLS -->
  <aside class="sidebar" aria-label="Editing controls">
    <div class="group">
      <h3>Image</h3>
      <div class="btn-grid">
        <button class="btn primary" id="uploadBtn">⬆ Upload</button>
        <button class="btn ghost" id="resetBtn" disabled>↺ Reset</button>
      </div>
    </div>

    <div class="group">
      <h3>Presets</h3>
      <div class="presets" id="presets"></div>
    </div>

    <div class="group">
      <h3>Adjustments</h3>
      <div id="sliders"></div>
    </div>

    <div class="group">
      <h3>Transform</h3>
      <div class="btn-grid tri">
        <button class="btn" data-act="rotL" disabled>⟲ Left</button>
        <button class="btn" data-act="rotR" disabled>⟳ Right</button>
        <button class="btn" data-act="flipH" disabled>⇋ Flip H</button>
        <button class="btn" data-act="flipV" disabled>⇅ Flip V</button>
      </div>
    </div>

    <div class="group">
      <h3>Export</h3>
      <div class="btn-grid">
        <button class="btn primary" data-act="dlPng" disabled>Download PNG</button>
        <button class="btn" data-act="dlJpg" disabled>Download JPG</button>
      </div>
    </div>

    <p class="meta" id="meta">No image loaded. Upload a photo to start editing.</p>
  </aside>

  <!-- STAGE -->
  <main class="stage" id="stage">
    <span class="hint" id="hint" style="display:none">Live preview</span>
    <div class="dropzone" id="dropzone">
      <div class="ic">🖼️</div>
      <h2>Drop a photo here</h2>
      <p>or choose a file from your device — everything stays in your browser.</p>
      <button class="pick" id="pickBtn">Choose Photo</button>
    </div>
    <canvas id="canvas"></canvas>

    <div class="stagebar" id="stagebar" style="display:none">
      <button data-act="rotL" title="Rotate left">⟲</button>
      <button data-act="rotR" title="Rotate right">⟳</button>
      <button data-act="flipH" title="Flip horizontal">⇋</button>
      <button data-act="flipV" title="Flip vertical">⇅</button>
      <button data-act="reset" title="Reset all">↺</button>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept="image/*" class="sr-only" aria-label="Upload image">

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var fileInput = document.getElementById('fileInput');
  var dropzone = document.getElementById('dropzone');
  var stage = document.getElementById('stage');
  var stagebar = document.getElementById('stagebar');
  var hint = document.getElementById('hint');
  var meta = document.getElementById('meta');

  var img = null;          // source Image
  var fileName = 'photo';

  // adjustment definitions: css filter based
  var DEFAULTS = {brightness:100, contrast:100, saturate:100, grayscale:0, sepia:0, hue:0, blur:0, invert:0};
  var UNITS = {brightness:'%', contrast:'%', saturate:'%', grayscale:'%', sepia:'%', hue:'deg', blur:'px', invert:'%'};
  var CONF = {
    brightness:{min:0,max:200,label:'Brightness'},
    contrast:{min:0,max:200,label:'Contrast'},
    saturate:{min:0,max:200,label:'Saturation'},
    grayscale:{min:0,max:100,label:'Grayscale'},
    sepia:{min:0,max:100,label:'Sepia'},
    hue:{min:0,max:360,label:'Hue'},
    blur:{min:0,max:20,label:'Blur'},
    invert:{min:0,max:100,label:'Invert'}
  };
  var adj = Object.assign({}, DEFAULTS);
  var rotation = 0;        // degrees: 0/90/180/270
  var flipH = false, flipV = false;

  var PRESETS = {
    'Original': {},
    'Warm':   {saturate:120, sepia:22, brightness:104},
    'Cool':   {saturate:110, hue:200, brightness:102},
    'B&W':    {grayscale:100, contrast:112},
    'Vintage':{sepia:55, contrast:92, saturate:80, brightness:104},
    'Vivid':  {saturate:165, contrast:118},
    'Fade':   {contrast:82, brightness:112, saturate:78},
    'Invert': {invert:100}
  };

  /* ---------- build sliders ---------- */
  var slidersEl = document.getElementById('sliders');
  Object.keys(CONF).forEach(function(key){
    var c = CONF[key];
    var wrap = document.createElement('div'); wrap.className='control';
    wrap.innerHTML =
      '<div class="row"><span>'+c.label+'</span><span id="val-'+key+'"></span></div>'+
      '<input type="range" id="rng-'+key+'" min="'+c.min+'" max="'+c.max+'" value="'+adj[key]+'">';
    slidersEl.appendChild(wrap);
    var rng = wrap.querySelector('input');
    rng.addEventListener('input', function(){
      adj[key] = Number(rng.value);
      clearActivePreset();
      syncSlider(key); draw();
    });
  });

  function syncSlider(key){
    var rng = document.getElementById('rng-'+key);
    var c = CONF[key];
    rng.value = adj[key];
    var pct = ((adj[key]-c.min)/(c.max-c.min))*100;
    rng.style.setProperty('--fill', pct+'%');
    document.getElementById('val-'+key).textContent = adj[key]+UNITS[key];
  }
  function syncAllSliders(){ Object.keys(CONF).forEach(syncSlider); }

  /* ---------- presets ---------- */
  var presetsEl = document.getElementById('presets');
  Object.keys(PRESETS).forEach(function(name){
    var b = document.createElement('button');
    b.className='preset'; b.textContent=name; b.dataset.preset=name;
    b.addEventListener('click', function(){ applyPreset(name); });
    presetsEl.appendChild(b);
  });
  function applyPreset(name){
    adj = Object.assign({}, DEFAULTS, PRESETS[name]);
    syncAllSliders();
    [].forEach.call(presetsEl.children,function(el){ el.classList.toggle('active', el.dataset.preset===name); });
    draw();
  }
  function clearActivePreset(){ [].forEach.call(presetsEl.children,function(el){ el.classList.remove('active'); }); }

  /* ---------- filter string ---------- */
  function filterString(){
    return 'brightness('+adj.brightness+'%) contrast('+adj.contrast+'%) saturate('+adj.saturate+'%) '+
           'grayscale('+adj.grayscale+'%) sepia('+adj.sepia+'%) hue-rotate('+adj.hue+'deg) '+
           'blur('+adj.blur+'px) invert('+adj.invert+'%)';
  }

  /* ---------- draw ---------- */
  function draw(){
    if(!img) return;
    var rotated = rotation===90 || rotation===270;
    var w = img.naturalWidth, h = img.naturalHeight;
    canvas.width  = rotated ? h : w;
    canvas.height = rotated ? w : h;

    ctx.save();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(rotation*Math.PI/180);
    ctx.scale(flipH?-1:1, flipV?-1:1);
    ctx.filter = filterString();
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();

    meta.innerHTML = '<b>'+fileName+'</b><br>'+w+' × '+h+' px • rotation '+rotation+'°';
  }

  /* ---------- load image ---------- */
  function loadFile(file){
    if(!file || !/^image\//.test(file.type)) return;
    fileName = (file.name || 'photo').replace(/\.[^.]+$/,'');
    var reader = new FileReader();
    reader.onload = function(e){
      var im = new Image();
      im.onload = function(){
        img = im;
        adj = Object.assign({}, DEFAULTS);
        rotation = 0; flipH = false; flipV = false;
        clearActivePreset();
        presetsEl.firstChild.classList.add('active');
        syncAllSliders();
        showEditor();
        draw();
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function showEditor(){
    dropzone.style.display='none';
    canvas.style.display='block';
    stagebar.style.display='flex';
    hint.style.display='block';
    setEnabled(true);
  }
  function setEnabled(on){
    document.getElementById('resetBtn').disabled = !on;
    [].forEach.call(document.querySelectorAll('[data-act]'), function(b){
      if(b.dataset.act!=='reset') b.disabled = !on;
    });
  }

  /* ---------- actions ---------- */
  function reset(){
    if(!img) return;
    adj = Object.assign({}, DEFAULTS);
    rotation=0; flipH=false; flipV=false;
    clearActivePreset(); presetsEl.firstChild.classList.add('active');
    syncAllSliders(); draw();
  }
  function download(type){
    if(!img) return;
    var mime = type==='jpg' ? 'image/jpeg' : 'image/png';
    var q = type==='jpg' ? 0.92 : undefined;
    var out = document.createElement('canvas');
    out.width=canvas.width; out.height=canvas.height;
    var octx=out.getContext('2d');
    if(type==='jpg'){ octx.fillStyle='#fff'; octx.fillRect(0,0,out.width,out.height); }
    octx.drawImage(canvas,0,0);
    out.toBlob(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url; a.download=fileName+'-edited.'+type;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},1500);
    }, mime, q);
  }
  function handleAct(act){
    switch(act){
      case 'rotL': rotation=(rotation+270)%360; draw(); break;
      case 'rotR': rotation=(rotation+90)%360; draw(); break;
      case 'flipH': flipH=!flipH; draw(); break;
      case 'flipV': flipV=!flipV; draw(); break;
      case 'reset': reset(); break;
      case 'dlPng': download('png'); break;
      case 'dlJpg': download('jpg'); break;
    }
  }
  [].forEach.call(document.querySelectorAll('[data-act]'), function(b){
    b.addEventListener('click', function(){ handleAct(b.dataset.act); });
  });
  document.getElementById('resetBtn').addEventListener('click', reset);

  /* ---------- upload wiring ---------- */
  function openPicker(){ fileInput.click(); }
  document.getElementById('uploadBtn').addEventListener('click', openPicker);
  document.getElementById('pickBtn').addEventListener('click', openPicker);
  fileInput.addEventListener('change', function(e){ if(e.target.files[0]) loadFile(e.target.files[0]); fileInput.value=''; });

  ['dragenter','dragover'].forEach(function(ev){
    stage.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add('drag'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    stage.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove('drag'); });
  });
  stage.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });
  // allow paste from clipboard
  window.addEventListener('paste', function(e){
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(var i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')===0){ loadFile(items[i].getAsFile()); break; }
    }
  });

  presetsEl.firstChild.classList.add('active');
})();
</script>
</body>
</html>
